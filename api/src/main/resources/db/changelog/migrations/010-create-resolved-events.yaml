databaseChangeLog:
  - changeSet:
      id: 010-create-resolved-events
      author: chronicles
      changes:
        - createTable:
            tableName: resolved_events
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: narrative_event_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: choice_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: resolved_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: resolved_events
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_resolved_events_user
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: resolved_events
            baseColumnNames: narrative_event_id
            referencedTableName: narrative_events
            referencedColumnNames: id
            constraintName: fk_resolved_events_narrative_event
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: resolved_events
            baseColumnNames: choice_id
            referencedTableName: choices
            referencedColumnNames: id
            constraintName: fk_resolved_events_choice
            onDelete: CASCADE

        - addUniqueConstraint:
            tableName: resolved_events
            columnNames: user_id, narrative_event_id
            constraintName: uq_resolved_events_user_event

databaseChangeLog:
  - changeSet:
      id: 006-create-narrative-events
      author: chronicles
      changes:
        - createTable:
            tableName: narrative_events
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: title
                  type: VARCHAR(150)
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: TEXT
                  constraints:
                    nullable: false

              - column:
                  name: narrative_phase
                  type: VARCHAR(50)
                  constraints:
                    nullable: true

              - column:
                  name: required_level
                  type: INTEGER
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false

              - column:
                  name: priority
                  type: INTEGER
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

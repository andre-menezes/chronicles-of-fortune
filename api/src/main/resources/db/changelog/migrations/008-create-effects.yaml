databaseChangeLog:
  - changeSet:
      id: 008-create-effects
      author: chronicles
      changes:
        - createTable:
            tableName: effects
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: choice_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: effect_type
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

              - column:
                  name: value
                  type: DECIMAL(15, 2)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: effects
            baseColumnNames: choice_id
            referencedTableName: choices
            referencedColumnNames: id
            constraintName: fk_effects_choice
            onDelete: CASCADE

databaseChangeLog:
  - changeSet:
      id: 007-create-choices
      author: chronicles
      changes:
        - createTable:
            tableName: choices
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: narrative_event_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: text
                  type: VARCHAR(500)
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: TEXT
                  constraints:
                    nullable: true

              - column:
                  name: display_order
                  type: INTEGER
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: choices
            baseColumnNames: narrative_event_id
            referencedTableName: narrative_events
            referencedColumnNames: id
            constraintName: fk_choices_narrative_event
            onDelete: CASCADE

databaseChangeLog:
  - changeSet:
      id: 009-create-trigger-rules
      author: chronicles
      changes:
        - createTable:
            tableName: trigger_rules
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: narrative_event_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: condition_type
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

              - column:
                  name: operator
                  type: VARCHAR(5)
                  constraints:
                    nullable: true

              - column:
                  name: threshold_value
                  type: DECIMAL(15, 2)
                  constraints:
                    nullable: true

              - column:
                  name: probability
                  type: DECIMAL(4, 3)
                  constraints:
                    nullable: true

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: trigger_rules
            baseColumnNames: narrative_event_id
            referencedTableName: narrative_events
            referencedColumnNames: id
            constraintName: fk_trigger_rules_narrative_event
            onDelete: CASCADE

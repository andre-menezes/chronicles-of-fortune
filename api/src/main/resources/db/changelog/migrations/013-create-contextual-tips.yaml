databaseChangeLog:
  - changeSet:
      id: 013-create-contextual-tips
      author: chronicles
      changes:
        - createTable:
            tableName: contextual_tips
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: text
                  type: TEXT
                  constraints:
                    nullable: false

              - column:
                  name: context
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

              - column:
                  name: category
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

spring:
  mvc:
    servlet:
      path: /   # sem prefixo nos testes — controllers acessados diretamente
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

app:
  jwt:
    # Chave fixa para testes (base64 de uma string longa o suficiente para HMAC-SHA256)
    secret: dGVzdFNlY3JldEtleUZvclRlc3RpbmdQdXJwb3Nlc09ubHlNdXN0QmVBdExlYXN0MjU2Yml0cw==
    expiration-ms: 86400000

services:
  postgres:
    image: postgres:16
    container_name: chronicles-postgres
    environment:
      POSTGRES_DB: chronicles_db
      POSTGRES_USER: chronicles_user
      POSTGRES_PASSWORD: chronicles_pass
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
